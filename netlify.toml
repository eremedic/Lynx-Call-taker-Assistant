# AmbuIntake on Netlify
#   - public/ is served as static pages
#   - /api/* runs in the Netlify Function netlify/functions/api.mjs (its
#     route is declared in the function itself: export const config)
#   - data is stored in Supabase Postgres (DATABASE_URL)
# Environment variables are listed in README.md → "Deploy to Netlify".

[build]
  publish = "public"
  command = "echo 'No build step needed'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pg-native is an optional add-on of the Postgres driver that isn't used.
  external_node_modules = ["pg-native"]
  # The embedded database is only for local runs and tests; leave it out of
  # the function so it stays small (about 3 MB) and starts quickly.
  included_files = ["!node_modules/@electric-sql/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"
