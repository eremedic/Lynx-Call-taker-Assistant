# Patient Intake on Netlify
#   - public/ is served as static pages
#   - /api/* runs in the Netlify Function netlify/functions/api.mjs (its
#     route is declared in the function itself: export const config)
#   - data is stored in Supabase Postgres (DATABASE_URL)
# Environment variables are listed in README.md → "Deploy to Netlify".

[build]
  publish = "public"
  # Records the deployed commit in public/version.json (shown on /status.html).
  command = "node scripts/write-version.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pg-native is an optional add-on of the Postgres driver that isn't used.
  external_node_modules = ["pg-native"]
  # The embedded database is only for local runs and tests; leave it out of
  # the function so it stays small (about 3 MB) and starts quickly.
  included_files = ["!node_modules/@electric-sql/**"]

# Pages, scripts and styles are always revalidated, so a new deploy shows up
# on the next load instead of an old copy from the browser cache.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"
